name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF_TYPE" != "branch" ]]; then
            echo "Releases must be dispatched from a branch." >&2
            exit 1
          fi

          current_version="$(./mvnw --batch-mode --no-transfer-progress -q \
            -DforceStdout help:evaluate -Dexpression=project.version)"
          snapshot_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-SNAPSHOT$'
          release_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

          if [[ "$current_version" =~ $snapshot_pattern ]]; then
            version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            update_pom=true
          elif [[ "$current_version" =~ $release_pattern ]]; then
            version="$current_version"
            update_pom=false
          else
            echo "Expected a semantic version like 1.2.3-SNAPSHOT, got: $current_version" >&2
            exit 1
          fi

          tag="v$version"
          remote_tag="$(git ls-remote --refs origin "refs/tags/$tag")"

          if [[ "$update_pom" == "true" && -n "$remote_tag" ]]; then
            echo "Tag $tag already exists; refusing to overwrite it." >&2
            exit 1
          fi
          if [[ "$update_pom" == "false" && -z "$remote_tag" ]]; then
            echo "POM version is already released but tag $tag does not exist." >&2
            exit 1
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "update_pom=$update_pom"
          } >> "$GITHUB_OUTPUT"

      - name: Set release version in POM
        if: steps.release.outputs.update_pom == 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw --batch-mode --no-transfer-progress \
            org.codehaus.mojo:versions-maven-plugin:2.18.0:set \
            -DnewVersion="$RELEASE_VERSION" \
            -DgenerateBackupPoms=false \
            -DprocessParent=false \
            -DprocessDependencies=false \
            -DprocessPlugins=false

          actual_version="$(./mvnw --batch-mode --no-transfer-progress -q \
            -DforceStdout help:evaluate -Dexpression=project.version)"
          if [[ "$actual_version" != "$RELEASE_VERSION" ]]; then
            echo "Expected POM version $RELEASE_VERSION, got: $actual_version" >&2
            exit 1
          fi

      - name: Run tests and package application
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Run frontend tests
        run: npm test

      - name: Prepare release assets
        id: assets
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          jar_name="TriviaThrone-${RELEASE_VERSION}.jar"
          jar="target/$jar_name"
          if [[ ! -f "$jar" ]]; then
            echo "Expected packaged application at $jar" >&2
            exit 1
          fi

          (cd target && sha256sum "$jar_name" > "$jar_name.sha256")
          echo "jar=$jar" >> "$GITHUB_OUTPUT"

      - name: Commit and tag release
        if: steps.release.outputs.update_pom == 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- pom.xml
          if git diff --cached --quiet; then
            echo "No POM version change to commit." >&2
            exit 1
          fi
          git commit -m "Release TriviaThrone $RELEASE_VERSION"
          git tag --annotate "$RELEASE_TAG" --message "TriviaThrone $RELEASE_VERSION"
          git push --atomic origin \
            "HEAD:${GITHUB_REF_NAME}" \
            "refs/tags/${RELEASE_TAG}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_JAR: ${{ steps.assets.outputs.jar }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "$RELEASE_JAR" "$RELEASE_JAR.sha256" \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              "$RELEASE_JAR" "$RELEASE_JAR.sha256" \
              --verify-tag \
              --title "TriviaThrone $RELEASE_VERSION" \
              --generate-notes
          fi
