name: Test and build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Cache Maven wrapper distribution
        uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper/dists
          key: ${{ runner.os }}-maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend tools
        run: npm ci

      - name: Build and test Java modules
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Test frontend
        run: npm test
