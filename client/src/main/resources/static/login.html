<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TriviaThrone</title>
    <link rel="stylesheet" href="/css/pages/login.css">
</head>
<body class="login-body">
    <header class="site-header login-header">
        <div class="site-brand">
            <h1>TriviaThrone</h1>
            <span id="app-version" class="app-version" aria-live="polite">Version loading…</span>
        </div>
        <div class="topbar-credits" aria-label="Made by">
            <span>Made by</span>
            <ul id="topbar-authors"><li role="status">Loading…</li></ul>
        </div>
    </header>
    <main class="login-page">
        <section id="login-container" class="panel">
            <h2>Login</h2>
            <form id="login-form">
                <div id="login-inputs">
                    <input type="text" id="username" placeholder="Username" required>
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                <div id="login-error"></div>
                <div class="separator"></div>
                <button type="submit" class="primary-btn">Login</button>
            </form>
        </section>
    </main>

    <script type="module" src="/js/root/version.js"></script>
    <script type="module" src="/js/root/credits.js"></script>
    <script type="module" src="/js/page-login/index.js"></script>
</body>
</html>
