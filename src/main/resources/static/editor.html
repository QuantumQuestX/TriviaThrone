<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor - TriviaThrone</title>
    <link rel="stylesheet" href="/css/editor.css">
</head>

<body>
    <header>
        <h1>TriviaThrone</h1>
        <nav>
            <p id="username-info">Logged in as: <span id="username-display"></span></p>
            <button id="save-draft-btn" class="secondary-btn">Save</button>
            <button id="clear-draft-btn" class="secondary-btn">Clear</button>
            <button id="upload-btn" class="primary-btn">Upload</button>
            <button id="logout-btn" class="danger-btn">Logout</button>
        </nav>
    </header>

    <main class="editor-layout">
        <aside id="left-panel" class="side-panel panel collapsed">
            <div class="panel-header">
                <h2>Resources</h2>
                <div class="btn-container">
                    <button id="left-panel-fold-btn" class="fold-btn">◀</button>
                </div>
            </div>
            <div class="panel-content">
                <div class="upload-container">
                    <div class="upload-box">
                        <input type="file" id="game-file" accept=".game.throne">
                        <label for="game-file">Drop or Select <code>.game.throne</code> file</label>
                    </div>
                    <div id="upload-status" class="upload-status"></div>
                </div>
                <div class="separator"></div>
                <div id="resource-list" class="resource-list"></div>
            </div>
        </aside>

        <section class="panel">
            <div class="panel-header">
                <h2>Game Settings</h2>
            </div>
            <div class="panel-content game-settings">
                <div class="settings-box">
                    <div class="settings-top">
                        <!-- Left Column: Game Meta -->
                        <div class="settings-meta">
                            <div class="setting-item">
                                <label for="game-title" class="setting-item-title">Game Title</label>
                                <input type="text" id="game-title" placeholder="Enter game title">
                            </div>
                            <div class="setting-item">
                                <label for="game-description" class="setting-item-title">Description</label>
                                <textarea id="game-description" placeholder="Enter game description"></textarea>
                            </div>
                        </div>

                        <!-- Right Column: Round & Counters -->
                        <div class="settings-rounds">
                            <div class="round-select-group">
                                <label class="setting-item-title">Round</label>
                                <div class="round-input-group">
                                    <select id="round-select" class="secondary-btn">
                                    </select>
                                    <input type="text" id="round-name" placeholder="Round name" maxlength="16">
                                    <button id="add-round-btn" type="button" class="secondary-btn">Add</button>
                                    <button id="remove-round-btn" type="button" class="secondary-btn">Remove</button>
                                </div>
                            </div>

                            <div class="counter-row">
                                <div class="setting-item">
                                    <label class="setting-item-title">Categories</label>
                                    <div class="horizontal-item-group">
                                        <button id="category-count-dec" type="button"
                                            class="secondary-btn mono">-</button>
                                        <span id="category-count-text" class="count-text mono">1</span>
                                        <button id="category-count-inc" type="button"
                                            class="secondary-btn mono">+</button>
                                    </div>
                                </div>

                                <div class="setting-item">
                                    <label class="setting-item-title">Questions</label>
                                    <div class="horizontal-item-group">
                                        <button id="question-count-dec" type="button"
                                            class="secondary-btn mono">-</button>
                                        <span id="question-count-text" class="count-text mono">1</span>
                                        <button id="question-count-inc" type="button"
                                            class="secondary-btn mono">+</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div></div><!-- EMPTY AREA -->
                    </div>

                </div>
                <div class="game-board">
                    <div id="jeopardy-canvas">

                    </div>
                </div>
            </div>
        </section>

        <aside id="right-panel" class="side-panel panel collapsed">
            <div class="panel-header">
                <div class="btn-container">
                    <button id="right-panel-fold-btn" class="fold-btn">▶</button>
                </div>
                <h2>Question Editor</h2>
            </div>
            <div class="panel-content question-editor-panel">
                <div class="question-editor">
                    <div class="question-container">
                        <label class="setting-item-title">Category</label>
                        <input type="text" id="question-category-input" placeholder="Category 1" readonly>
                    </div>
                    <div class="question-container">
                        <label class="setting-item-title">Prompt</label>
                        <input type="text" id="question-prompt-input" placeholder="Prompt">
                    </div>
                    <div class="question-container">
                        <label class="setting-item-title">Points</label>
                        <input type="number" min="100" max="10000" step="100" id="question-points-input"
                            placeholder="100">
                    </div>
                    <div class="question-container">
                        <label class="setting-item-title">Type</label>
                        <select id="question-type-select" class="secondary-btn" disabled>
                            <option value="text">Text</option>
                            <option value="audio">Audio</option>
                            <option value="video">Video</option>
                            <option value="image">Image</option>
                            <option value="mcq">Multiple Choice</option>
                        </select>
                    </div>
                    <div id="question-media-settings" class="question-container" style="visibility: hidden;">
                        <label class="setting-item-title">Media</label>
                        <select id="question-media-select" class="secondary-btn">
                            <option value="">-- Select Resource --</option>
                        </select>
                    </div>
                    <div id="question-choice-settings" class="question-container" style="visibility: hidden;">
                        <label class="setting-item-title">Choices</label>
                        <div id="question-choice-container">
                        </div>
                        <button id="question-add-choice-btn" type="button" class="secondary-btn">Add Choice</button>
                    </div>
                </div>
                <button id="question-editor-apply-btn" class="primary-btn">Apply</button>
            </div>
        </aside>
    </main>

    <script type="module" src="/js/editor/editor.js"></script>
</body>

</html>
