<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{0} - TriviaThrone</title>
    <link rel="stylesheet" href="/css/game.css">
</head>
<body>
    <header class="login-header">
        <h1>TriviaThrone</h1>
        <div id="lobby-info">
            Lobby Code: <span id="lobby-code">A123</span>
        </div>
        <nav>
            <p id="username-info">Logged in as: <span id="username-display"></span></p>
            <button id="leave-btn" class="danger-btn">Leave Lobby</button>
        </nav>
    </header>

    <main data-game="jeopardy">
        <section id="question-panel" class="panel">
            <div id="jeopardy-board">
                <h2 id="jeopardy-round-title">&lt;round-title&gt;</h2>
                <div id="jeopardy-canvas">
                    
                </div>
            </div>
            <div id="question-display" style="display: none;">

            </div>
        </section>

        <section id="player-buzzer-panel" class="panel">
            <div id="players-left" class="players players-left">
            </div>

            <div id="main-buzzer-container">
                <button id="main-buzzer" class="buzzer" disabled>BUZZ</button>
                <span id="main-score">0</span>
            </div>

            <div id="players-right" class="players players-right">
            </div>
        </section>
    </main>

    <script type="module" src="/js/page-game/game.js"></script>
</body>
</html>
