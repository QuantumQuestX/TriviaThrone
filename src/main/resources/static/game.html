<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{0} - TriviaThrone</title>
    <link rel="stylesheet" href="/css/pages/game.css">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body class="game-page">
    <header class="site-header">
        <h1 id="game-title">TriviaThrone</h1>
        <div id="lobby-info">
            Lobby Code: <span id="lobby-code">A123</span>
        </div>
        <nav>
            <p id="username-info">Logged in as: <span id="username-display"></span></p>
            <button id="leave-btn" class="danger-btn">Leave Lobby</button>
        </nav>
    </header>

    <main class="game-layout" data-game="jeopardy">
        <section id="question-panel" class="game-stage panel">
            <div id="jeopardy-board" class="hidden">
                <h2 id="jeopardy-round-title">&lt;round-title&gt;</h2>
                <div id="round-selector" class="round-selector" role="tablist" aria-label="Game rounds"></div>
                <div id="jeopardy-canvas">

                </div>
            </div>
            <div id="question-display" class="question-view hidden">
                <div class="question-header">
                    <span id="question-category">Category Name</span>
                    <span id="question-points">100</span>
                </div>

                <div class="question-body">
                    <div id="question-text" class="question-text">
                        Here goes the question prompt...
                    </div>

                    <div id="question-media" class="question-media">
                        <video id="q-media-video" class="hidden"></video>
                        <audio id="q-media-audio" class="hidden"></audio>
                        <img id="q-media-image" class="hidden" alt="Question Media">
                    </div>

                    <div id="question-choices" class="question-choices hidden">
                        <div class="question-choice closed">Choice 1</div>
                        <div class="question-choice closed">Choice 2</div>
                        <div class="question-choice closed">Choice 3</div>
                        <div class="question-choice closed">Choice 4</div>
                    </div>
                </div>
            </div>
        </section>

        <p id="game-status" class="game-status" role="status" aria-live="polite">Connecting to game…</p>

        <section id="host-panel" class="host-controls panel" data-admin>
            <div class="host-panel">
                <h4>Buzzer</h4>
                <div class="host-panel-container">
                    <button id="host-buzzer-enable" class="primary-btn" disabled>Open</button>
                    <button id="host-buzzer-disable" class="primary-btn" disabled>Close</button>
                </div>
            </div>
            <div class="host-panel">
                <h4>Question</h4>
                <div class="host-panel-container">
                    <button id="host-show-question" class="primary-btn" disabled>Correct</button>
                    <button id="host-hide-question" class="danger-btn" disabled>Incorrect (−½)</button>
                </div>
            </div>
            <button id="host-next-question" class="primary-btn" disabled>Next Question</button>
            <button id="host-end-game" class="danger-btn">End Game &amp; Return to Lobby</button>
        </section>

        <section id="player-buzzer-panel" class="player-buzzer-panel panel">
            <div id="players-left" class="players players-left">
            </div>

            <div id="main-buzzer-container" class="main-buzzer-container">
                <button id="main-buzzer" class="buzzer" disabled aria-label="Buzz in">BUZZ</button>
                <span id="main-score">0</span>
            </div>

            <div id="players-right" class="players players-right">
            </div>
        </section>
    </main>

    <script type="module" src="/js/page-game/index.js"></script>
</body>
</html>
