<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobby - TriviaThrone</title>
    <link rel="stylesheet" href="css/lobby.css">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>
    <header>
        <h1>TriviaThrone</h1>
        <div id="lobby-info">
            Lobby Code: <span id="lobby-code">A123</span>
        </div>
        <nav>
            <p id="username-info">Logged in as: <span id="username-display"></span></p>
            <button id="leave-btn" class="danger-btn">Leave Lobby</button>
        </nav>
    </header>

    <main class="lobby-layout">
        <section class="players-panel">
            <h2>Players</h2>
            <ul id="player-list" class="player-list"></ul>

            <div class="host-controls">
                <button id="cancel-game-btn" class="fullwidth-btn danger-btn">Cancel Game</button>
                <button id="start-game-btn" class="fullwidth-btn primary-btn">Start Game</button>
            </div>
        </section>

        <section class="feed-panel">
            <h2>Live Activity</h2>
            <div id="event-feed" class="event-feed"></div>
        </section>

        <section id="host-panel" class="upload-panel">
            <h2>Upload Game</h2>

            <div class="upload-box">
                <input type="file" id="game-file" accept=".game.throne">
                <label for="game-file">Drop or Select <code>.game.throne</code> file</label>
            </div>

            <button id="upload-btn" class="fullwidth-btn primary-btn">Upload</button>

            <div id="upload-status" class="upload-status"></div>
        </section>
    </main>

    <script src="js/root/token.js"></script>
    <script src="js/root/topbar.js"></script>
    <script src="js/lobby.js"></script>
</body>
</html>
