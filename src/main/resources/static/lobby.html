<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobby - TriviaThrone</title>
    <link rel="stylesheet" href="/css/pages/lobby.css">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body class="lobby-page">
    <header class="site-header">
        <div class="site-brand">
            <h1>TriviaThrone</h1>
            <span id="app-version" class="app-version" aria-live="polite">Version loading…</span>
        </div>
        <div id="lobby-info">
            Lobby Code: <span id="lobby-code">A123</span>
        </div>
        <nav>
            <p id="username-info">Logged in as: <span id="username-display" data-current-user></span></p>
            <button id="leave-btn" class="danger-btn">Leave Lobby</button>
        </nav>
    </header>

    <main class="lobby-layout">
        <section class="players-panel panel">
            <h2>Players</h2>
            <ul id="player-list" class="player-list"></ul>

            <div class="host-controls" data-admin="true" style="display: none;">
                <!--<button id="cancel-game-btn" data-admin="true" class="fullwidth-btn danger-btn">Cancel Game</button>-->
                <button id="start-game-btn" class="fullwidth-btn primary-btn">Start Game</button>
            </div>
        </section>

        <section class="feed-panel panel">
            <h2>Live Activity</h2>
            <div id="event-feed" class="event-feed"></div>
        </section>

        <section id="host-panel" data-admin="true" class="upload-pane panel" style="display: none;">
            <h2>Upload Game</h2>

            <div class="upload-box">
                <input type="file" id="game-file" accept=".game.throne">
                <label for="game-file">Drop or Select <code>.game.throne</code> file</label>
            </div>

            <button id="upload-btn" class="fullwidth-btn primary-btn">Upload</button>

            <p id="upload-status" class="upload-status"></p>
        </section>
    </main>

    <script type="module" src="/js/root/version.js"></script>
    <script type="module" src="/js/page-lobby/index.js"></script>
</body>
</html>
