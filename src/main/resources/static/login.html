<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TriviaThrone</title>
    <style>
        body {
            font-family: sans-serif;
            background: #1e1e1e;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        #login-container {
            background: #2c2c2c;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 0 10px black;
        }

        input {
            display: block;
            width: 100%;
            margin: 0.5rem 0;
            padding: 0.5rem;
            border-radius: 4px;
            border: none;
        }

        button {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 4px;
            background: #4caf50;
            color: white;
            cursor: pointer;
            font-size: 1rem;
        }

        button:hover {
            background: #45a049;
        }

        #login-error {
            margin-top: 0.5rem;
            color: #f44336;
        }
    </style>
</head>
<body>
    <div id="login-container">
        <h1>Login</h1>
        <form id="login-form">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>
    <div id="login-error"></div>

    <script src="js/login.js"></script>
</body>
</html>
