spring:
  application:
    name: TriviaThrone
auth:
  # Override with a private signing key outside local development.
  jwt-secret: ${AUTH_JWT_SECRET:CHANCE_THIS_SECRET_CHANGE_THIS_SECRET}
  token-validity-seconds: 900
  refresh-token-validity-seconds: 604800
  refresh-session-max-seconds: 2592000
  # Enable when serving the application over HTTPS.
  refresh-cookie-secure: ${AUTH_REFRESH_COOKIE_SECURE:false}
  initial-admin-username: ${AUTH_INITIAL_ADMIN_USERNAME:}
  initial-admin-password: ${AUTH_INITIAL_ADMIN_PASSWORD:}

triviathrone:
  mods:
    system-directory: ${TRIVIATHRONE_SYSTEM_MODS_DIRECTORY:mods/system}
  system:
    data-directory: ${TRIVIATHRONE_SYSTEM_DATA_DIRECTORY:data/system}
    h2:
      jdbc-url: ${AUTH_USER_DATABASE_URL:jdbc:h2:file:./triviathrone-users;AUTO_SERVER=TRUE}
      username: ${AUTH_USER_DATABASE_USERNAME:sa}
      password: ${AUTH_USER_DATABASE_PASSWORD:}
