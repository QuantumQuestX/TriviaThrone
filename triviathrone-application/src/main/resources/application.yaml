spring:
  application:
    name: TriviaThrone
  servlet:
    multipart:
      max-file-size: ${TRIVIATHRONE_MAX_UPLOAD_SIZE:50MB}
      max-request-size: ${TRIVIATHRONE_MAX_UPLOAD_SIZE:50MB}
server:
  tomcat:
    max-http-form-post-size: ${TRIVIATHRONE_MAX_UPLOAD_SIZE:50MB}
auth:
  # Must be supplied through the environment.
  jwt-secret: ${AUTH_JWT_SECRET:}
  token-validity-seconds: 900
  refresh-token-validity-seconds: 604800
  refresh-session-max-seconds: 2592000
  # Enable when serving the application over HTTPS.
  refresh-cookie-secure: ${AUTH_REFRESH_COOKIE_SECURE:false}
  initial-admin-username: ${AUTH_INITIAL_ADMIN_USERNAME:}
  initial-admin-password: ${AUTH_INITIAL_ADMIN_PASSWORD:}

triviathrone:
  lobby:
    empty-active-game-timeout: ${TRIVIATHRONE_EMPTY_GAME_TIMEOUT:30s}
    empty-active-game-cleanup-interval: ${TRIVIATHRONE_EMPTY_GAME_CLEANUP_INTERVAL:10s}
  mods:
    system-directory: ${TRIVIATHRONE_SYSTEM_MODS_DIRECTORY:mods/system}
  system:
    data-directory: ${TRIVIATHRONE_SYSTEM_DATA_DIRECTORY:data/system}
